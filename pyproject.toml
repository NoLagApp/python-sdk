[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nolag"
version = "2.1.0"
description = "NoLag real-time messaging SDK for Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "NoLag", email = "support@nolag.app" }
]
keywords = ["nolag", "real-time", "messaging", "websocket", "pubsub"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Internet",
    "Framework :: AsyncIO",
]
dependencies = [
    "websockets>=12.0",
    "msgpack>=1.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
webrtc = [
    "aiortc>=1.6.0",
]

[project.urls]
Homepage = "https://nolag.app"
Documentation = "https://docs.nolag.app"
Repository = "https://github.com/NoLagApp/nolag-python"

[tool.hatch.build.targets.wheel]
packages = ["nolag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["nolag.api_types", "nolag.webrtc"]
ignore_errors = true
